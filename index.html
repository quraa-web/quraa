<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#073b2b">
<meta name="description" content="قُرّاء - موقع للاستماع إلى القرآن الكريم وقراءة آياته">
<title>قُرّاء | QURAA</title>

<style>
:root {
  --green: #073b2b;
  --green2: #0d513b;
  --gold: #d8b66a;
  --cream: #f8f4e9;
  --text: #f8f4e9;
  --muted: #c8d6cd;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Tahoma, Arial, sans-serif;
  color: var(--text);
  background:
    radial-gradient(ellipse at top, #16543c 0%, transparent 65%),
    var(--green);
  min-height: 100vh;
}

header {
  padding: 26px 16px 22px;
  text-align: center;
  border-bottom: 1px solid rgba(216,182,106,.35);
  background: rgba(0,0,0,.12);
}

.logo {
  color: var(--gold);
  font-size: clamp(34px, 7vw, 48px);
  font-weight: bold;
  letter-spacing: 2px;
}

.subtitle {
  margin-top: 8px;
  color: var(--muted);
  font-size: 14px;
}

.container {
  width: min(1100px, 94%);
  margin: 22px auto 40px;
}

.panel {
  background: rgba(255,255,255,.055);
  border: 1px solid rgba(216,182,106,.28);
  border-radius: 18px;
  padding: 18px;
  margin-bottom: 18px;
  box-shadow: 0 8px 25px rgba(0,0,0,.12);
}

h2 {
  color: var(--gold);
  font-size: 20px;
  margin: 0 0 15px;
}

.controls {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 12px;
}

input, select, button {
  font: inherit;
  border-radius: 10px;
  padding: 12px;
}

input, select {
  min-width: 0;
  width: 100%;
  color: var(--text);
  background: #104632;
  border: 1px solid rgba(216,182,106,.4);
  outline: none;
}

select option {
  background: #073b2b;
  color: white;
}

button {
  cursor: pointer;
  border: 1px solid var(--gold);
  background: var(--gold);
  color: #173526;
  font-weight: bold;
  transition: .2s;
}

button:hover {
  filter: brightness(1.08);
}

button:disabled {
  opacity: .5;
  cursor: not-allowed;
}

.audio-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 12px;
}

.audio-buttons button {
  flex: 1;
  min-width: 100px;
}

audio {
  display: block;
  width: 100%;
  margin-top: 16px;
}

.status {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.8;
  margin-top: 10px;
  overflow-wrap: anywhere;
}

.status.error {
  color: #ffb8a9;
}

.layout {
  display: grid;
  grid-template-columns: 280px minmax(0,1fr);
  gap: 18px;
  align-items: start;
}

.surah-list {
  display: grid;
  gap: 8px;
  max-height: 650px;
  overflow-y: auto;
  padding-left: 3px;
}

.surah-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  text-align: right;
  width: 100%;
  color: var(--text);
  background: rgba(255,255,255,.045);
  border: 1px solid rgba(216,182,106,.17);
  font-weight: normal;
}

.surah-item.active {
  color: var(--gold);
  background: rgba(216,182,106,.13);
  border-color: var(--gold);
}

.surah-number {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-width: 30px;
  height: 30px;
  border: 1px solid rgba(216,182,106,.5);
  border-radius: 50%;
  font-size: 12px;
}

.surah-name {
  flex: 1;
}

.surah-meta {
  font-size: 11px;
  color: var(--muted);
}

.reader-heading {
  text-align: center;
  border-bottom: 1px solid rgba(216,182,106,.22);
  padding-bottom: 15px;
  margin-bottom: 18px;
}

.reader-heading h2 {
  font-size: 27px;
  margin-bottom: 8px;
}

.ayahs {
  color: var(--cream);
  font-family: "Traditional Arabic", "Amiri", Tahoma, serif;
  font-size: clamp(22px, 3.5vw, 29px);
  line-height: 2.25;
  text-align: justify;
}

.ayah {
  cursor: pointer;
  border-radius: 6px;
  padding: 1px 2px;
}

.ayah:hover {
  background: rgba(216,182,106,.12);
}

.ayah.playing {
  color: var(--gold);
  background: rgba(216,182,106,.12);
}

.ayah-number {
  color: var(--gold);
  font-family: Tahoma, Arial, sans-serif;
  font-size: 15px;
  white-space: nowrap;
}

.empty {
  text-align: center;
  color: var(--muted);
  padding: 25px 8px;
  line-height: 1.9;
}

footer {
  text-align: center;
  color: var(--muted);
  padding: 22px 12px;
  border-top: 1px solid rgba(216,182,106,.2);
  font-size: 13px;
}

@media (max-width: 720px) {
  .container {
    width: 94%;
    margin-top: 14px;
  }

  .layout {
    grid-template-columns: 1fr;
  }

  .surah-list {
    max-height: 330px;
  }

  .controls {
    grid-template-columns: 1fr;
  }

  .panel {
    padding: 14px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">QURAA</div>
  <div style="color:var(--gold);font-size:23px;margin-top:5px">قُرّاء</div>
  <div class="subtitle">رفيقك في تلاوة القرآن الكريم</div>
</header>

<main class="container">

  <section class="panel">
    <h2>🎧 الاستماع إلى القرآن الكريم</h2>

    <div class="controls">
      <div>
        <label for="readerSelect" class="status">اختر القارئ</label>
        <select id="readerSelect">
          <option value="ar.alafasy">مشاري العفاسي</option>
          <option value="ar.abdurrahmaansudais">عبدالرحمن السديس</option>
          <option value="ar.husary">محمود خليل الحصري</option>
          <option value="ar.minshawi">محمد صديق المنشاوي</option>
        </select>
      </div>

      <div>
        <label for="surahSelect" class="status">اختر السورة</label>
        <select id="surahSelect" disabled>
          <option value="">جاري تحميل السور...</option>
        </select>
      </div>
    </div>

    <div class="audio-buttons">
      <button id="playButton" type="button" disabled>▶ تشغيل السورة</button>
      <button id="pauseButton" type="button">⏸ إيقاف مؤقت</button>
      <button id="restartButton" type="button" disabled>↺ إعادة من البداية</button>
    </div>

    <audio id="audioPlayer" controls preload="none"></audio>
    <div id="audioStatus" class="status" aria-live="polite">
      جاري تجهيز مشغل القرآن الكريم...
    </div>
  </section>

  <div class="layout">

    <section class="panel">
      <h2>📖 سور القرآن الكريم</h2>

      <input
        id="searchInput"
        type="search"
        placeholder="ابحث عن اسم السورة أو رقمها..."
        aria-label="البحث عن سورة"
      >

      <div id="surahList" class="surah-list" style="margin-top:14px">
        <div class="empty">جاري تحميل السور...</div>
      </div>
    </section>

    <section class="panel">
      <div class="reader-heading">
        <h2 id="currentSurahTitle">القرآن الكريم</h2>
        <div id="surahInfo" class="status">اختر سورة للبدء بالقراءة</div>
      </div>

      <div id="quranText" class="ayahs">
        <div class="empty">اختر سورة من القائمة لعرض الآيات الكريمة.</div>
      </div>
    </section>

  </div>
</main>

<footer>
  قُرّاء QURAA — اللهم اجعل القرآن الكريم ربيع قلوبنا
</footer>

<script>
"use strict";

const API = "https://api.alquran.cloud/v1";

const surahList = document.getElementById("surahList");
const surahSelect = document.getElementById("surahSelect");
const readerSelect = document.getElementById("readerSelect");
const searchInput = document.getElementById("searchInput");
const quranText = document.getElementById("quranText");
const currentSurahTitle = document.getElementById("currentSurahTitle");
const surahInfo = document.getElementById("surahInfo");
const audioPlayer = document.getElementById("audioPlayer");
const audioStatus = document.getElementById("audioStatus");
const playButton = document.getElementById("playButton");
const pauseButton = document.getElementById("pauseButton");
const restartButton = document.getElementById("restartButton");

let allSurahs = [];
let currentSurah = null;
let currentAyahs = [];
let currentAyahIndex = 0;
let requestNumber = 0;
let audioRequestNumber = 0;
let loadingAudio = false;

function setStatus(element, message, isError = false) {
  element.textContent = message;
  element.classList.toggle("error", isError);
}

async function fetchJSON(url) {
  const response = await fetch(url);

  if (!response.ok) {
    throw new Error("تعذر الاتصال بمصدر البيانات. رمز الخطأ: " + response.status);
  }

  const data = await response.json();

  if (data.code !== 200) {
    throw new Error(data.status || "تعذر تحميل البيانات.");
  }

  return data.data;
}

function renderSurahs(filter = "") {
  const query = filter.trim().toLowerCase();

  const filtered = allSurahs.filter(surah =>
    surah.name.includes(query) ||
    surah.englishName.toLowerCase().includes(query) ||
    String(surah.number) === query
  );

  surahList.replaceChildren();

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "لم يتم العثور على سورة بهذا الاسم.";
    surahList.appendChild(empty);
    return;
  }

  filtered.forEach(surah => {
    const button = document.createElement("button");
    button.type = "button";
    button.className = "surah-item";

    if (currentSurah && currentSurah.number === surah.number) {
      button.classList.add("active");
    }

    const number = document.createElement("span");
    number.className = "surah-number";
    number.textContent = surah.number;

    const name = document.createElement("span");
    name.className = "surah-name";
    name.textContent = surah.name;

    const meta = document.createElement("span");
    meta.className = "surah-meta";
    meta.textContent = surah.numberOfAyahs + " آية";

    button.append(number, name, meta);
    button.addEventListener("click", () => loadSurah(surah.number));

    surahList.appendChild(button);
  });
}

async function loadSurahs() {
  setStatus(audioStatus, "جاري الاتصال بمصدر بيانات القرآن الكريم...");

  try {
    const data = await fetchJSON(API + "/surah");

    if (!Array.isArray(data) || data.length !== 114) {
      throw new Error("وصلت بيانات غير مكتملة لقائمة السور.");
    }

    allSurahs = data;

    surahSelect.replaceChildren();

    allSurahs.forEach(surah => {
      const option = document.createElement("option");
      option.value = surah.number;
      option.textContent = surah.number + " - " + surah.name;
      surahSelect.appendChild(option);
    });

    surahSelect.disabled = false;
    renderSurahs();

    setStatus(audioStatus, "تم تحميل السور بنجاح. اختر سورة للاستماع.");

    loadSurah(1);

  } catch (error) {
    console.error("QURAA loadSurahs error:", error);

    surahList.innerHTML = "";
    const message = document.createElement("div");
    message.className = "empty";
    message.textContent =
      "تعذر تحميل السور. تأكد من اتصال الإنترنت ثم اضغط زر إعادة المحاولة أدناه.";

    const retry = document.createElement("button");
    retry.type = "button";
    retry.textContent = "إعادة المحاولة";
    retry.addEventListener("click", loadSurahs);

    surahList.append(message, retry);
    surahSelect.disabled = true;

    setStatus(
      audioStatus,
      "حدث خطأ أثناء تحميل قائمة السور: " + error.message,
      true
    );
  }
}

async function loadSurah(number) {
  const surah = allSurahs.find(item => item.number === Number(number));

  if (!surah) return;

  const thisRequest = ++requestNumber;
  ++audioRequestNumber;

  currentSurah = surah;
  currentAyahs = [];
  currentAyahIndex = 0;
  loadingAudio = false;

  audioPlayer.pause();
  audioPlayer.removeAttribute("src");
  audioPlayer.load();

  playButton.disabled = true;
  restartButton.disabled = true;

  surahSelect.value = String(surah.number);
  currentSurahTitle.textContent = surah.name;
  surahInfo.textContent = "جاري تحميل الآيات...";
  quranText.innerHTML = '<div class="empty">جاري تحميل الآيات الكريمة...</div>';

  renderSurahs(searchInput.value);

  try {
    const data = await fetchJSON(
      API + "/surah/" + surah.number + "/quran-uthmani"
    );

    if (thisRequest !== requestNumber) return;

    currentAyahs = data.ayahs || [];

    if (!currentAyahs.length) {
      throw new Error("لم تصل آيات السورة.");
    }

    quranText.replaceChildren();

    currentAyahs.forEach((ayah, index) => {
      const span = document.createElement("span");
      span.className = "ayah";
      span.dataset.index = index;
      span.textContent = ayah.text + " ";

      span.addEventListener("click", () => playAyah(index));

      quranText.appendChild(span);

      const numberSpan = document.createElement("span");
      numberSpan.className = "ayah-number";
      numberSpan.textContent = "۞ " + toArabicNumbers(ayah.numberInSurah) + " ";
      quranText.appendChild(numberSpan);
    });

    surahInfo.textContent =
      surah.revelationType === "Meccan" ? "مكية" : "مدنية";
    surahInfo.textContent += " • عدد الآيات: " + surah.numberOfAyahs;

    playButton.disabled = false;
    restartButton.disabled = false;

    setStatus(audioStatus, "تم تحميل سورة " + surah.name + ". اضغط تشغيل للاستماع.");

  } catch (error) {
    if (thisRequest !== requestNumber) return;

    console.error("QURAA loadSurah error:", error);

    quranText.innerHTML = "";
    const message = document.createElement("div");
    message.className = "empty";
    message.textContent = "تعذر تحميل آيات السورة. تحقق من الإنترنت وحاول مرة أخرى.";
    quranText.appendChild(message);

    surahInfo.textContent = "تعذر تحميل السورة";
    setStatus(audioStatus, error.message, true);
  }
}

function toArabicNumbers(value) {
  return String(value).replace(/\d/g, digit => "٠١٢٣٤٥٦٧٨٩"[digit]);
}

function markPlaying(index) {
  document.querySelectorAll(".ayah.playing").forEach(element => {
    element.classList.remove("playing");
  });

  const active = quranText.querySelector('[data-index="' + index + '"]');

  if (active) {
    active.classList.add("playing");
    active.scrollIntoView({ behavior: "smooth", block: "nearest" });
  }
}

async function playAyah(index) {
  if (!currentSurah || loadingAudio) return;

  if (index < 0 || index >= currentAyahs.length) return;

  currentAyahIndex = index;
  loadingAudio = true;

  const thisAudioRequest = ++audioRequestNumber;
  const surahNumber = currentSurah.number;
  const reader = readerSelect.value;

  setStatus(
    audioStatus,
    "جاري تجهيز الآية " + toArabicNumbers(index + 1) +
    " من سورة " + currentSurah.name + "..."
  );

  try {
    const data = await fetchJSON(
      API + "/surah/" + surahNumber + "/" + reader
    );

    if (thisAudioRequest !== audioRequestNumber) return;

    const ayahs = data.ayahs || [];
    const selectedAyah = ayahs[index];

    if (!selectedAyah || !selectedAyah.audio) {
      throw new Error("الملف الصوتي غير متاح لهذه الآية.");
    }

    audioPlayer.src = selectedAyah.audio;
    audioPlayer.load();

    markPlaying(index);

    setStatus(
      audioStatus,
      "سورة " + currentSurah.name +
      " • الآية " + toArabicNumbers(index + 1)
    );

    loadingAudio = false;

    try {
      await audioPlayer.play();
    } catch (playError) {
      setStatus(
        audioStatus,
        "اضغط زر التشغيل داخل مشغل الصوت لبدء التلاوة.",
        true
      );
    }

  } catch (error) {
    if (thisAudioRequest !== audioRequestNumber) return;

    loadingAudio = false;
    console.error("QURAA audio error:", error);

    setStatus(
      audioStatus,
      "تعذر تشغيل التلاوة: " + error.message,
      true
    );
  }
}

audioPlayer.addEventListener("ended", () => {
  if (currentAyahIndex + 1 < currentAyahs.length) {
    playAyah(currentAyahIndex + 1);
  } else {
    markPlaying(-1);
    setStatus(audioStatus, "انتهت تلاوة سورة " + currentSurah.name + ".");
  }
});

audioPlayer.addEventListener("error", () => {
  if (audioPlayer.currentSrc) {
    setStatus(
      audioStatus,
      "تعذر تشغيل الملف الصوتي. جرّب قارئًا آخر أو تحقق من الإنترنت.",
      true
    );
  }
});

playButton.addEventListener("click", () => {
  if (!currentSurah) return;

  if (
    audioPlayer.src &&
    !audioPlayer.ended &&
    audioPlayer.paused
  ) {
    audioPlayer.play().catch(() => {
      playAyah(currentAyahIndex);
    });
  } else {
    playAyah(currentAyahIndex);
  }
});

pauseButton.addEventListener("click", () => {
  audioPlayer.pause();
});

restartButton.addEventListener("click", () => {
  playAyah(0);
});

surahSelect.addEventListener("change", event => {
  loadSurah(Number(event.target.value));
});

searchInput.addEventListener("input", event => {
  renderSurahs(event.target.value);
});

readerSelect.addEventListener("change", () => {
  if (currentSurah) {
    playAyah(0);
  }
});

loadSurahs();
</script>

</body>
</html>
